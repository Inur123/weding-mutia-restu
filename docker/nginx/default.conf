map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

map $forwarded_proto $forwarded_port {
    default $server_port;
    https 443;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite fingerprints every file in this directory. The URL changes whenever
    # its contents change, so browsers and Cloudflare may cache it indefinitely.
    location ^~ /build/assets/ {
        try_files $uri =404;
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    # Build manifests keep stable filenames and must always be revalidated.
    location = /build/manifest.json {
        try_files $uri =404;
        expires -1;
        access_log off;
    }

    location = /build/fonts-manifest.json {
        try_files $uri =404;
        expires -1;
        access_log off;
    }

    location ^~ /build/ {
        try_files $uri =404;
        expires -1;
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires -1;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires -1;
    }

    location ^~ /storage/ {
        try_files $uri =404;
        expires -1;
    }

    # Any static file without a content fingerprint must be revalidated. New
    # application assets should be emitted through Vite under /build/assets/.
    location ~* \.(?:css|js|mjs|map|json|webmanifest|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico|mp3|mp4|webm|ogg|wav)$ {
        try_files $uri =404;
        expires -1;
        access_log off;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(?:artisan|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml|vite\.config\.[^/]+)$ {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
}
